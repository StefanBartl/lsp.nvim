name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: stylua --check
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua/ scripts/ TESTS/

      - uses: leafo/gh-actions-lua@v13
        with:
          # Matches this repo's own .luacheckrc (std = "lua51"); luacheck 1.2.0
          # also fails to load under newer Lua.
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua scripts TESTS

      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      # docs/BINDINGS.md's keymap tables are generated from the catalogue.
      # Without this the two drift the first time an entry changes, which is
      # exactly what generating them was meant to prevent.
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE --headless -l scripts/gen_bindings.lua --check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-lint
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore

  test:
    # The spec suite. plenary provides the busted harness; lib.nvim is a hard
    # dependency of the plugin itself. ui.nvim is a soft one (lspdoctor, the
    # root/workspace pickers, ...) that TESTS/lsp/pack_spec.lua exercises.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          path: .deps/plenary.nvim
          # Pinned to the 2026-09-20 HEAD; bump deliberately, not by drifting.
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/ui.nvim
          path: .deps/ui.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      # TESTS/lsp/probe_live_spec.lua runs `:LspDoctor probe` against a real
      # server -- the one case in the suite that verifies the diagnostics chain
      # end to end instead of stubbing it. Without a server installed that case
      # skips, and a gate that skips itself still counts as green, so it is
      # written to *fail* under CI when it finds none. This step is what keeps
      # it honest; ts_ls is the cheapest of the three candidates to install
      # (node is already on the runner) and answered in ~1s when measured.
      - name: language server for the live probe
        # `typescript`, not "typescript@latest": 7.0.2 is TypeScript's own
        # native-compiled rewrite and no longer ships lib/tsserver.js at
        # all, which the installed typescript-language-server still expects
        # -- measured against the real CI failure ("provides no
        # tsserver.js"), not assumed. Pinned to the last classic-architecture
        # major.
        run: npm install -g typescript@5 typescript-language-server
        # ts_ls does not resolve a global-only "typescript" install from a
        # bare temp root_dir with no node_modules of its own (its own
        # lookup, not Node's require() -- NODE_PATH did not change the
        # outcome, measured). TESTS/lsp/probe_live_spec.lua's ts_ls
        # candidate symlinks a real node_modules/typescript into its temp
        # root_dir from wherever `npm root -g` says this install landed.
      - name: plenary specs
        env:
          PLENARY_PATH: .deps/plenary.nvim
          LIB_NVIM_PATH: .deps/lib.nvim
          UI_NVIM_PATH: .deps/ui.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE --headless --noplugin -u TESTS/minimal_init.lua             -c "PlenaryBustedDirectory TESTS/lsp { minimal_init = 'TESTS/minimal_init.lua', sequential = true }"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-test-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore

  smoke:
    # End-to-end, and deliberately separate from the specs above: this one runs
    # the real `setup()` against the real modules, which is exactly what the
    # stubbed specs cannot check. Needs ui.nvim too: `step("lspdoctor", ...)`
    # runs unconditionally, and the smoke test asserts zero setup warnings
    # under the default config -- a missing ui.kit would push one.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/ui.nvim
          path: .deps/ui.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE --headless -u NONE \
            -c "set rtp^=." -c "set rtp^=.deps/lib.nvim" -c "set rtp^=.deps/ui.nvim" \
            -c "luafile TESTS/smoke.lua" -c "qa!"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-smoke
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore

  # See lib.nvim's own templates/README.md ("Pinning lib.nvim in CI") for why:
  # ci-verified only moves once lint+test+smoke are green here, so this
  # repo's own consumers can pin ref: ci-verified instead of main and never
  # see a red build that's actually this repo's WIP.
  publish-ci-verified:
    name: publish ci-verified branch
    needs: [lint, test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: git push origin HEAD:refs/heads/ci-verified --force

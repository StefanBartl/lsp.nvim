name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: stylua --check
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua/ scripts/ TESTS/

      - uses: leafo/gh-actions-lua@v13
        with:
          # Matches this repo's own .luacheckrc (std = "lua51"); luacheck 1.2.0
          # also fails to load under newer Lua.
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua scripts TESTS

      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      # docs/BINDINGS.md's keymap tables are generated from the catalogue.
      # Without this the two drift the first time an entry changes, which is
      # exactly what generating them was meant to prevent.
      - run: nvim --headless -l scripts/gen_bindings.lua --check

  test:
    # The spec suite. plenary provides the busted harness; lib.nvim is a hard
    # dependency of the plugin itself. ui.nvim is a soft one (lspdoctor, the
    # root/workspace pickers, ...) that TESTS/lsp/pack_spec.lua exercises.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          path: .deps/plenary.nvim
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/ui.nvim
          path: .deps/ui.nvim
      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      # TESTS/lsp/probe_live_spec.lua runs `:LspDoctor probe` against a real
      # server -- the one case in the suite that verifies the diagnostics chain
      # end to end instead of stubbing it. Without a server installed that case
      # skips, and a gate that skips itself still counts as green, so it is
      # written to *fail* under CI when it finds none. This step is what keeps
      # it honest; ts_ls is the cheapest of the three candidates to install
      # (node is already on the runner) and answered in ~1s when measured.
      - name: language server for the live probe
        run: |
          npm install -g typescript typescript-language-server
          # ts_ls resolves "typescript" the way Node itself does, and the
          # probe's root_dir is a bare temp directory with no
          # node_modules/typescript of its own -- so a global-only install
          # is invisible to it without NODE_PATH pointing at where npm -g
          # actually put it. Without this, initialize fails with "Could not
          # find a valid TypeScript installation" and the probe times out
          # waiting for a client that already gave up.
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: plenary specs
        env:
          PLENARY_PATH: .deps/plenary.nvim
          LIB_NVIM_PATH: .deps/lib.nvim
          UI_NVIM_PATH: .deps/ui.nvim
        run: |
          nvim --headless --noplugin -u TESTS/minimal_init.lua             -c "PlenaryBustedDirectory TESTS/lsp { minimal_init = 'TESTS/minimal_init.lua', sequential = true }"

  smoke:
    # End-to-end, and deliberately separate from the specs above: this one runs
    # the real `setup()` against the real modules, which is exactly what the
    # stubbed specs cannot check. Needs ui.nvim too: `step("lspdoctor", ...)`
    # runs unconditionally, and the smoke test asserts zero setup warnings
    # under the default config -- a missing ui.kit would push one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/ui.nvim
          path: .deps/ui.nvim
      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      - run: |
          nvim --headless -u NONE \
            -c "set rtp^=." -c "set rtp^=.deps/lib.nvim" -c "set rtp^=.deps/ui.nvim" \
            -c "luafile TESTS/smoke.lua" -c "qa!"

  # See lib.nvim's own templates/README.md ("Pinning lib.nvim in CI") for why:
  # ci-verified only moves once lint+test+smoke are green here, so this
  # repo's own consumers can pin ref: ci-verified instead of main and never
  # see a red build that's actually this repo's WIP.
  publish-ci-verified:
    name: publish ci-verified branch
    needs: [lint, test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: git push origin HEAD:refs/heads/ci-verified --force
